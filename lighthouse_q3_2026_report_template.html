<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KU Lighthouse — Q3 2026 Quarterly Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 13px; }
body { font-family: 'IBM Plex Sans', sans-serif; background: #fff; color: #1c1c1c; line-height: 1.5; }

:root {
  --font-body: 'IBM Plex Sans', sans-serif;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --ink:       #122947;
  --mid:       #4a5568;
  --soft:      #8a94a6;
  --rule:      #e6eaf0;
  --bg:        #f6f8fb;
  --accent:    #197f8e;
  --green:     #2d7a3a;
  --green-bg:  #e6f2e8;
  --amber:     #c47a10;
  --amber-bg:  #fdf3dc;
  --red:       #c0392b;
  --red-bg:    #fdecea;
  --purple:    #5b21b6;
  --purple-bg: #ede9fe;
  --science:   #2d7a3a;
  --sund:      #425570;
  --hum:       #197f8e;
  --samf:      #d4843e;
  --law:       #ffbd38;
  --theo:      #c73028;
  --ssh:        #197f8e;
  --ext:       #666666;
}

/* ─── COVER ─── */
.cover { background: var(--ink); padding: 56px 60px 48px; position: relative; overflow: hidden; }
.cover::before { content:''; position:absolute; right:-120px; top:-120px; width:480px; height:480px; border-radius:50%; border:1px solid rgba(255,255,255,.05); }
.cover::after { content:''; position:absolute; right:60px; top:60px; width:280px; height:280px; border-radius:50%; border:1px solid rgba(255,255,255,.04); }
.cover-eyebrow { font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.38); margin-bottom:16px; }
.cover h1 { font-family:'Playfair Display',Georgia,serif; font-size:52px; font-weight:400; line-height:1.08; color:#fff; }
.cover h1 span { color:#DB3B0A; }
.cover-meta { display:flex; gap:24px; margin-top:28px; flex-wrap:wrap; }
.cover-pill { font-size:10px; color:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:4px 14px; }
.cover-note { margin-top:24px; font-size:11px; color:rgba(255,255,255,.28); border-top:1px solid rgba(255,255,255,.06); padding-top:16px; }

/* ─── LAYOUT ─── */
.body-wrap { max-width:960px; margin:0 auto; padding:0 60px; }
.section { padding:32px 0 0; }
.section + .section { margin-top:32px; }
.section-eyebrow { font-size:9px; letter-spacing:.15em; text-transform:uppercase; color:var(--soft); display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.section-eyebrow::after { content:''; flex:1; height:1px; background:var(--rule); }
h2.section-title { font-family:'Playfair Display',Georgia,serif; font-size:22px; font-weight:400; color:var(--ink); margin-bottom:4px; }
.section-sub { font-size:12px; color:var(--soft); margin-bottom:18px; }

/* ─── KPI CARDS ─── */
.scorecard { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px; margin-bottom:10px; }
.scorecard-auto { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px; margin-bottom:10px; align-items:stretch; }
.scorecard-auto .kpi { display:flex; flex-direction:column; }
.scorecard-auto .kpi .kpi-vs { margin-top:auto; }
.scorecard-3 { grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); }
.scorecard-2 { grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); }
.kpi { background:var(--bg); border-radius:10px; padding:16px 16px 14px; position:relative; }
.kpi-label { font-size:10px; color:var(--soft); line-height:1.35; margin-bottom:8px; }
.kpi-value { font-family:'Playfair Display',serif; font-size:34px; font-weight:400; color:var(--ink); line-height:1; }
.kpi-value.up { color:var(--green); }
.kpi-value.watch { color:var(--amber); }
.kpi-sub { font-size:10px; color:var(--soft); margin-top:5px; }
.kpi-badge { position:absolute; top:10px; right:10px; font-size:8px; padding:2px 7px; border-radius:8px; font-weight:500; }
.badge-new { background:var(--green-bg); color:var(--green); }
.badge-q1 { background:var(--purple-bg); color:var(--purple); }
.badge-watch { background:var(--amber-bg); color:var(--amber); }
.kpi-vs .up { color:var(--green); font-weight:500; font-size:10px; }
.kpi-vs .dn { color:var(--red); font-weight:500; font-size:10px; }
.kpi-vs .na { color:var(--soft); font-size:10px; }

/* ─── EXEC SUMMARY ─── */
.obs-list { background:var(--bg); border-radius:12px; padding:20px 24px; }
.obs-item { display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--rule); }
.obs-item:last-child { border-bottom:none; padding-bottom:0; }
.obs-item:first-child { padding-top:0; }
.obs-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:6px; background:#122947; }
.dot-g { background:var(--green); }
.dot-a { background:var(--amber); }
.dot-b { background:var(--accent); }
.dot-p { background:var(--purple); }
.obs-body { font-size:12px; line-height:1.7; color:var(--mid); }
.obs-body strong { color:var(--ink); font-weight:600; }
.obs-body .tag { font-size:10px; background:#fff; border:1px solid var(--rule); border-radius:6px; padding:1px 6px; color:var(--soft); margin-left:4px; }

/* ─── HORIZONTAL BAR CHART ─── */
.hbar-chart { margin-top:4px; }
.hbar-row { display:flex; align-items:center; gap:10px; margin-bottom:7px; }
.hbar-label { font-size:10px; color:var(--soft); width:105px; flex-shrink:0; text-align:right; line-height:1.3; }
.hbar-label-wide { width:155px; }
.hbar-track { flex:1; height:8px; background:#edf2f7; border-radius:4px; overflow:hidden; }
.hbar-fill { height:100%; border-radius:4px; }
.hbar-val { font-size:11px; font-weight:500; color:var(--ink); width:72px; text-align:right; font-family:'IBM Plex Mono',monospace; white-space:nowrap; }
.hbar-val.soft { color:var(--soft); }

/* ─── STACKED BAR ─── */
.stacked-track { display:flex; height:10px; border-radius:5px; overflow:hidden; }
.fak-legend { display:flex; gap:12px; flex-wrap:wrap; font-size:10px; color:var(--soft); margin-top:8px; }
.fak-legend span { display:flex; align-items:center; gap:5px; }
.fak-legend i { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

/* ─── PROGRAMME TABLE ─── */
.prog-table { width:100%; border-collapse:collapse; font-size:12px; font-family:'DM Sans', sans-serif; }
.prog-table thead th { text-align:right; font-size:10px; font-weight:500; color:var(--soft); padding:6px 8px 8px; border-bottom:1px solid var(--rule); }
.prog-table thead th:first-child { text-align:left; }
.prog-table tbody td { padding:10px 8px; border-bottom:1px solid var(--rule); color:var(--mid); text-align:right; vertical-align:middle; }
.prog-table tbody td:first-child { text-align:left; color:var(--ink); font-weight:500; background:#fff; position:sticky; left:0; z-index:1; }
.prog-table thead th:first-child { background:#fff; position:sticky; left:0; z-index:2; }
.prog-table tbody tr:last-child td { border-bottom:none; }
.prog-table tfoot td { padding:8px 8px; font-weight:600; color:var(--ink); border-top:1px solid var(--rule); text-align:right; }
.prog-table tfoot td:first-child { text-align:left; background:#fff; position:sticky; left:0; }
@media (max-width:600px) {
  .prog-table .type-n, .prog-table .type-e { display:none; }
}
.type-n { background:#fde8e1; color:#DB3B0A; font-size:9px; padding:2px 7px; border-radius:8px; font-weight:500; display:inline-block; margin-left:5px; margin-bottom:3px; }
.type-e { background:#e8eef5; color:#122947; font-size:9px; padding:2px 7px; border-radius:8px; font-weight:500; display:inline-block; margin-left:5px; margin-bottom:3px; }
.type-emp { background:#d1fae5; color:#065f46; font-size:9px; padding:2px 7px; border-radius:8px; font-weight:500; display:inline-block; margin-left:5px; }

/* ─── EVENTS TABLE ─── */
.evt-table { width:100%; border-collapse:collapse; font-size:12px; }
.evt-table thead th { text-align:left; font-size:10px; font-weight:500; color:var(--soft); padding:6px 8px 8px; border-bottom:1px solid var(--rule); }
.evt-table thead th:last-child { text-align:right; }
.evt-table tbody td { padding:8px 8px; border-bottom:1px solid var(--rule); color:var(--mid); vertical-align:middle; }
.evt-table tbody td:first-child { color:var(--soft); font-size:10px; font-family:'IBM Plex Mono'; width:56px; }
.evt-table tbody td:last-child { text-align:right; font-weight:600; color:var(--ink); font-family:'IBM Plex Mono'; }
.evt-table tbody tr:last-child td { border-bottom:none; }
.evt-name { color:var(--ink); font-size:12px; }
.evt-mgr { font-size:10px; color:var(--soft); }

/* ─── GENDER ─── */
.gender-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.gender-card { background:var(--bg); border-radius:10px; padding:14px 16px; }
.gc-title { font-size:11px; font-weight:500; color:var(--ink); margin-bottom:10px; }
.gc-bar-wrap { display:flex; height:6px; border-radius:3px; overflow:hidden; margin-bottom:10px; }
.gc-row { display:flex; justify-content:space-between; font-size:11px; color:var(--soft); padding:2px 0; }
.gc-row span { font-weight:500; color:var(--ink); font-family:'IBM Plex Mono'; }

/* ─── TWO/THREE COL ─── */
.two-col { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px; }
.q2-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
@media (max-width:600px) { .q2-grid { grid-template-columns:1fr; } }
.three-col { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; }

/* ─── INSIGHT BOXES ─── */
.insight { border-left:3px solid #2563a8; padding:12px 16px; background:#e8f0f8; border-radius:0 8px 8px 0; font-size:12px; color:var(--mid); line-height:1.65; margin-top:12px; }
.insight strong { color:var(--ink); }
.insight-amber { border-left-color:var(--amber); background:var(--amber-bg); }
.insight-green { border-left-color:var(--green); background:var(--green-bg); }
.insight-purple { border-left-color:var(--purple); background:var(--purple-bg); }

/* ─── CARD ─── */
.card { background:var(--bg); border-radius:10px; padding:16px 18px; }
.card-title { font-size:10px; font-weight:500; color:var(--soft); text-transform:uppercase; letter-spacing:.08em; margin-bottom:12px; }

/* ─── DATA TABLE ─── */
.data-table { width:100%; border-collapse:collapse; font-size:11px; }
.data-table th { text-align:left; font-size:10px; font-weight:500; color:var(--soft); padding:5px 8px 7px; border-bottom:1px solid var(--rule); }
.data-table td { padding:6px 8px; border-bottom:1px solid #f3f5f8; color:var(--mid); }
.data-table td:first-child { color:var(--ink); }
.data-table tr:last-child td { border-bottom:none; }
.data-table .num { text-align:right; font-family:'IBM Plex Mono'; font-size:11px; font-weight:500; color:var(--ink); }
.data-table .soft { color:var(--soft); font-weight:400; }
.data-table tfoot td { font-weight:600; color:var(--ink); border-top:1px solid var(--rule); padding-top:7px; }

/* ─── CHAPTER BREAK ─── */
.chapter { background:var(--ink); padding:28px 60px 24px; margin:40px -60px 0; }
.chapter-pre { font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.3); margin-bottom:6px; }
.chapter h2 { font-family:'Playfair Display',serif; font-size:26px; font-weight:400; color:#fff; }
.chapter-sub { font-size:11px; color:rgba(255,255,255,.35); margin-top:6px; }

/* ─── FOOTER ─── */
.footer { background:var(--ink); padding:24px 60px; margin:48px -60px 0; }
.footer p { font-size:10px; color:rgba(255,255,255,.28); line-height:1.9; }

/* ─── STATUS PILL ─── */
.status { font-size:9px; padding:2px 8px; border-radius:8px; font-weight:500; display:inline-block; }
.st-track { background:var(--green-bg); color:var(--green); }
.st-watch { background:var(--amber-bg); color:var(--amber); }
.st-new  { background:var(--purple-bg); color:var(--purple); }

/* ─── DIVIDER ─── */
.divider { height:1px; background:var(--rule); margin:20px 0; }

/* ─── ACAD LEVEL VISUAL ─── */
.acad-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.acad-label { font-size:10px; color:var(--soft); width:140px; flex-shrink:0; text-align:right; }
.acad-track { flex:1; height:8px; background:#edf2f7; border-radius:4px; overflow:hidden; }
.acad-fill { height:100%; border-radius:4px; }
.acad-val { font-size:11px; font-weight:500; color:var(--ink); width:36px; text-align:right; font-family:'IBM Plex Mono'; }

/* ─── FUNNEL ─── */
.funnel-step { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; justify-content:flex-end; }
.funnel-bar { border-radius:4px 4px 0 0; width:100%; }
.funnel-num { font-size:26px; font-family:'Playfair Display',serif; color:var(--ink); line-height:1; margin-top:4px; }
.funnel-num.watch { color:var(--amber); }
.funnel-lbl { font-size:10px; color:var(--soft); text-align:center; line-height:1.3; }
.funnel-labels { display:flex; gap:6px; margin-top:8px; }
@media (max-width:480px) { .funnel-labels { display:none; } }

/* ─── USER PLATFORM CARD ─── */
.platform-card { background:var(--bg); border-radius:12px; padding:18px 20px; }
.platform-big { font-family:'Playfair Display',serif; font-size:44px; color:var(--ink); line-height:1; }
.platform-big.up { color:var(--green); }

@media print {
  body { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .chapter { margin:40px 0 0; }
  .footer { margin:48px 0 0; }
}

/* ─── HEAT GRID (faculty matrix) ─── */
.heat-grid { display: grid; grid-template-columns: 148px repeat(6,1fr); gap: 3px; font-size: 10px; margin-top: 12px; }
.heat-grid .hg-header { background: var(--bg); border-radius: 4px; padding: 7px 4px; text-align: center; color: var(--soft); font-weight: 500; font-size: 9px; line-height: 1.35; }
.heat-grid .hg-label  { padding: 7px 10px 7px 0; color: var(--mid); font-weight: 500; display: flex; align-items: center; font-size: 11px; }
.heat-grid .hg-cell   { border-radius: 4px; padding: 7px 4px; text-align: center; font-family: 'IBM Plex Mono'; font-weight: 600; font-size: 11px; display: flex; align-items: center; justify-content: center; }
.heat-0  { background: #eef0f4; color: #c0c8d4; font-weight: 400; }
.heat-1  { background: #cce8ea; color: #0a5963; }
.heat-2  { background: #a8d4d8; color: #0a5963; }
.heat-3  { background: #7abcc4; color: #fff; }
.heat-5  { background: #3d8a94; color: #fff; }
.heat-hi { background: #3d8a94; color: #fff; }
.heat-total { background: #0a5963; color: #fff; border-radius: 4px; }
.ind-sep { font-size: 9px; letter-spacing: .13em; text-transform: uppercase; color: var(--soft); display: flex; align-items: center; gap: 10px; margin: 28px 0 14px; }
.ind-sep::after { content: ''; flex: 1; height: 1px; background: var(--rule); display: inline-block; }
.ind-badge { background: var(--bg); border-radius: 6px; padding: 2px 8px; font-family: 'IBM Plex Mono'; font-size: 9px; letter-spacing: 0; text-transform: none; color: var(--mid); flex-shrink: 0; }

/* ─── TBA / PLACEHOLDER (Q2 data pending) ─── */
.tba { color: var(--soft); font-style: italic; font-weight: 400 !important; }
.tba-cell { background: repeating-linear-gradient(135deg, #fff, #fff 6px, #fafbfc 6px, #fafbfc 12px); }
.tba-pill { font-size: 8px; padding: 2px 7px; border-radius: 8px; font-weight: 500; background: #eef1f5; color: var(--soft); border: 1px dashed #ccd3dd; }
.kpi-value.tba { font-size: 22px; letter-spacing: .02em; }
.tba-nodata { color: #c73028 !important; font-style: italic; font-weight: 600 !important; }
.tba-nodata-cell { background: repeating-linear-gradient(135deg, #fff, #fff 6px, #fdf2f1 6px, #fdf2f1 12px); }


/* ─── Q3 TEMPLATE ADDITIONS ─── */
:root { --q3: #5b21b6; }
.kt { width:100%; border-collapse:collapse; font-size:11.5px; font-family:'DM Sans',sans-serif; }
.kt thead th { font-size:9.5px; color:var(--soft); font-weight:500; border-bottom:2px solid var(--rule); padding:7px 8px; text-align:right; }
.kt thead th:first-child, .kt thead th.l { text-align:left; }
.kt thead th.cur { background:var(--bg); }
.kt tbody td { padding:7px 8px; text-align:right; color:var(--mid); border-bottom:1px solid var(--rule); }
.kt tbody tr:last-child td { border-bottom:none; }
.kt tbody td:first-child { text-align:left; color:var(--ink); }
.kt td.v { font-weight:700; color:var(--ink); }
.kt td.y { font-weight:600; color:var(--ink); }
.kt td.n { font-size:10.5px; color:var(--soft); text-align:left; }
.kt td.d { text-align:center; font-weight:600; color:var(--ink); }
.kt tr.grp td { background:var(--bg); padding:6px 8px; font-size:9px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--soft); text-align:left; border-bottom:none; }
.kt tr.grp a { color:inherit; text-decoration:none; }
.kt tr.grp a:hover { text-decoration:underline; }
.kt .g { color:var(--green); font-weight:600; }
.kt .a { color:var(--amber); font-weight:600; }
.kt .soft { color:var(--soft); }
.kt tfoot td { padding:8px 8px; font-weight:600; color:var(--ink); border-top:1px solid var(--rule); text-align:right; }
.kt tfoot td:first-child { text-align:left; }
.legend { display:flex; gap:16px; margin:8px 0 14px; flex-wrap:wrap; }
.legend span { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--soft); }
.legend i { width:10px; height:10px; border-radius:2px; display:inline-block; }
.legend.dots i { border-radius:50%; width:9px; height:9px; }
.fnote { font-size:10px; color:var(--soft); margin:6px 0 16px; }
.chart-title { font-size:11px; font-weight:500; color:var(--ink); margin-bottom:6px; }
details.arch { margin-top:16px; font-size:11px; color:var(--soft); }
details.arch summary { cursor:pointer; font-weight:500; margin-bottom:8px; }
.draft-banner { background:var(--amber-bg); border-left:3px solid var(--amber); color:var(--mid); font-size:11px; padding:10px 14px; margin:20px 0 0; border-radius:0 8px 8px 0; }
.insight-tbd { border-left-color:var(--q3); background:var(--purple-bg); font-style:italic; }
.evt-badge { font-size:8.5px; padding:1px 6px; border-radius:8px; color:#fff; font-weight:500; }
.pcard-title { font-size:11px; font-weight:500; color:var(--ink); margin-bottom:4px; }
.pcard-sub { font-size:11px; color:var(--soft); margin-bottom:12px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   KU LIGHTHOUSE — Q3 2026 REPORT TEMPLATE
   ───────────────────────────────────────────────────────────────────────
   HOW TO FILL IN Q3
   • All numbers live in the DATA blocks below. Tables, charts, YTD, % of 2025,
     Q3 vs Q2 arrows and totals are calculated automatically.
   • Q1 and Q2 are fixed. Q3 values are `null` = shown as "TBA".
     Replace `q3: null` with a number (or an object/array where shown).
   • Per-faculty arrays follow the label order given right next to them.
   • New department? Append the label AND a value to every array in that block
     (q1, q2, q3 …). New programme? Add an object to PROG and rows to PROG_DEMO.
   • Narrative text: fill in INSIGHTS at the bottom of the DATA section.
   • When the report is final, set REPORT.draft = false (hides the draft banner).
   ═══════════════════════════════════════════════════════════════════════ */

const REPORT = {
  quarter: 'Q3', year: 2026,
  period: 'July – September 2026',
  dataDate: '30 September 2026',
  ytdLabel: 'Q1–Q3 2026 YTD',
  paceShare: 0.75,      // green if YTD >= 75% of the full-year 2025 total
  draft: false
};

/* ── Top-level indicators (Q1, Q2 fixed; q3 = null → TBA) ─────────────── */
const IND = {
  // Student Innovation & Entrepreneurship
  curr_students: { label:'Students in curricular courses', q1:414, q2:340, q3:200, y25:869 },
  curr_courses:  { label:'Curricular courses',             q1:10,  q2:7,   q3:3,   y25:26 },
  ects:          { label:'ECTS projects',                  q1:13,  q2:8,   q3:17,  y25:43 },
  educators:     { label:'Educators engaged',              q1:102, q2:192, q3:61,  y25:'— (new in Q1)', noPace:true,
                   note:'Not unique educators — the same person may be counted more than once' },

/* ═══════════════════════════════════════════════════════════════════════
   RENDER CODE — normally no need to edit below this line
   ═══════════════════════════════════════════════════════════════════════ */
const C = { y25:'#c8d0d8', q1:'#2d7a3a', q2:'#d4843e', q3:'#5b21b6' };
const jobs = [];
const isNum = v => typeof v === 'number';
const fmt = v => isNum(v) ? v.toLocaleString('en-US') : v;
const TBA = '<span class="tba">TBA</span>';
const cellVal = v => (v === null || v === undefined) ? TBA : (typeof v === 'string' && v.startsWith('—') ? `<span class="soft">${v}</span>` : fmt(v));
const sum = a => a.reduce((s, v) => s + (isNum(v) ? v : (typeof v === 'string' && /^\d/.test(v) ? parseInt(v, 10) : 0)), 0);
const hasData = a => Array.isArray(a) && a.length > 0;
const num0 = v => isNum(v) ? v : 0;

/* ── building blocks ── */
function box(id, h) { return `<div style="position:relative;width:100%;height:${h}px;margin-bottom:6px"><canvas id="${id}"></canvas></div>`; }
function legend(items, dots) { return `<div class="legend${dots ? ' dots' : ''}">` + items.map(i => `<span><i style="background:${i[1]}"></i>${i[0]}</span>`).join('') + '</div>'; }
const LEG_Q = legend([['2025 total', C.y25], ['Q1 2026', C.q1], ['Q2 2026', C.q2], ['Q3 2026', C.q3]]);
const LEG_Q3 = legend([['Q1 2026', C.q1], ['Q2 2026', C.q2], ['Q3 2026', C.q3]]);
function sec(eyebrow, title, sub, body, pad) {
  return `<div class="section"${pad ? ' style="padding-top:28px"' : ''}><div class="section-eyebrow">${eyebrow}</div><h2 class="section-title">${title}</h2>${sub ? `<p class="section-sub">${sub}</p>` : ''}${body}</div>`;
}
function chap(id, pre, title) { return `<div class="chapter"${id ? ` id="${id}"` : ''}><div class="chapter-pre">${pre}</div><h2>${title}</h2></div>`; }
function ins(key) {
  const t = INSIGHTS[key];
  return t ? `<div class="insight">${t}</div>` : `<div class="insight insight-tbd">Q3 insight — to be written once the figures are in.</div>`;
}
const note = t => `<p class="fnote">${t}</p>`;
const sep = t => `<div class="ind-sep">${t}</div>`;

/* ── KPI tables ── */
function kpiRow(r, o) {
  let ytd, pct;
  if (r.stock) { ytd = 'n/a*'; pct = 'n/a*'; }
  else if (typeof r.q3 === 'string' && r.q3.startsWith('n/a')) { ytd = 'n/a'; pct = 'n/a'; }
  else if (r.noYtd) { ytd = '—'; pct = '—'; }
  else if (!isNum(r.q3)) { ytd = TBA; pct = (isNum(r.y25) && !r.noPace) ? TBA : '—'; }
  else {
    const s = sum([r.q1, r.q2, r.q3]);
    ytd = fmt(s);
    if (isNum(r.y25) && !r.noPace) { const p = Math.round(s / r.y25 * 100); pct = `<span class="${p >= REPORT.paceShare * 100 ? 'g' : 'a'}">${p}%</span>`; }
    else pct = '—';
  }
  let d = '—';
  if (isNum(r.q3) && isNum(r.q2)) d = r.q3 > r.q2 ? '↑' : r.q3 < r.q2 ? '↓' : '→';
  let h = `<tr><td>${r.label}</td><td>${cellVal(r.q1)}</td><td>${cellVal(r.q2)}</td><td class="v">${cellVal(r.q3)}</td>`;
  if (o.delta) h += `<td class="d">${d}</td>`;
  if (o.yoy) h += `<td>${cellVal(r.yoy ? r.yoy.q3_2025 : '—')}</td>`;
  h += `<td class="y">${ytd}</td><td>${cellVal(r.y25)}</td><td>${pct}</td>`;
  if (o.note) h += `<td class="n">${r.note || ''}</td>`;
  return h + '</tr>';
}
function kpiTable(rows, o) {
  o = o || {};
  const cols = 7 + (o.delta ? 1 : 0) + (o.yoy ? 1 : 0) + (o.note ? 1 : 0) + 1;
  let h = '<div style="overflow-x:auto"><table class="kt"><thead><tr><th>Indicator</th><th>Q1 2026</th><th>Q2 2026</th><th class="cur">Q3 2026</th>';
  if (o.delta) h += '<th class="cur">Q3 vs Q2</th>';
  if (o.yoy) h += `<th>${o.yoy}</th>`;
  h += `<th>${REPORT.ytdLabel.replace('2026 YTD', '2026<br>YTD')}</th><th>2025 (full year)</th><th>% of 2025 (YTD pace)</th>`;
  if (o.note) h += '<th class="l">Note</th>';
  h += '</tr></thead><tbody>';
  rows.forEach(r => {
    if (r.group) h += `<tr class="grp"><td colspan="${cols}"><a href="${r.href}">${r.group} →</a></td></tr>`;
    else h += kpiRow(r, o);
  });
  return h + '</tbody></table></div>';
}
const I = k => IND[k];
const paceNote = `<p class="fnote">Colour-coding applies to "% of 2025 (YTD pace)": green = at or above ${Math.round(REPORT.paceShare * 100)}% (${REPORT.ytdLabel.replace(' YTD', '')} vs. full-year 2025), amber = below the ${Math.round(REPORT.paceShare * 100)}% pace line.</p>`;
const STOCK_NOTE = '<p class="fnote">* Student users and startup-projects are totals at quarter-end, not additive across quarters — YTD and pace are n/a. Student users/startup-projects: Q1 and 2025 use the old method (all platform users and projects); from Q2 only currently active student users/projects are counted, so Q1 is not comparable with Q2 and later. Q3 vs Q2 is comparable. The Q2 values were recalculated for the Q3 report (users 26 → 143, startup-projects 11 → 71) after an error was found in the original Q2 calculation methodology, where only newcomers were calculated and not all active. Student users include users who are not from UCPH in all quarters (Q2: 54, Q3: 53); counting UCPH students only gives 89 in Q2 and 100 in Q3.</p>';

/* ── Chart configs ── */
const GC = 'rgba(128,128,128,0.1)', TC = 'rgba(120,120,120,0.75)';
function ds(label, data, color, stack, extra) { return Object.assign({ label, data, backgroundColor: color, borderWidth: 0, stack }, extra || {}); }
function stackedCfg(labels, s, title, fs) {
  const z = a => (hasData(a) ? a.map(num0) : labels.map(() => 0));
  const sets = [];
  if (s.y25) sets.push(ds('2025 total', s.y25, C.y25, 'y2025'));
  if (s.q1) sets.push(ds('Q1 2026', s.q1, C.q1, 'y2026'));
  sets.push(ds('Q2 2026', s.q2, C.q2, 'y2026'));
  sets.push(ds('Q3 2026', z(s.q3), C.q3, 'y2026'));
  return { type: 'bar', data: { labels, datasets: sets }, options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
    scales: {
      x: { grid: { color: GC }, ticks: { color: TC, font: { size: fs || 10 } }, border: { display: false } },
      y: { min: 0, grid: { color: GC }, ticks: { color: TC, font: { size: 10 } }, title: { display: true, text: title, color: TC, font: { size: 9 } }, border: { display: false } }
    } } };
}
function facChartBox(id, key, title, h, fs) {
  const f = FACS[key];
  jobs.push([id, stackedCfg(f.labels, f, title, fs)]);
  return box(id, h);
}
function facCfgQ(labels, q1, q2, q3, rotate) {
  const z = a => (hasData(a) ? a.map(num0) : labels.map(() => 0));
  return { type: 'bar', data: { labels, datasets: [ds('Q1 2026', q1, C.q1, 's'), ds('Q2 2026', q2, C.q2, 's'), ds('Q3 2026', z(q3), C.q3, 's')] }, options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.parsed.y > 0 ? c.dataset.label + ': ' + c.parsed.y : null } } },
    scales: {
      x: { stacked: true, grid: { display: false }, ticks: Object.assign({ color: TC, font: { size: rotate ? 9 : 10.5 } }, rotate ? { maxRotation: 55, minRotation: 55 } : {}), border: { display: false } },
      y: { stacked: true, min: 0, grid: { color: GC }, ticks: { color: TC, font: { size: 10 }, precision: 0 }, border: { display: false } }
    } } };
}
function pctBarCfg(labels, raw, names, colors) {
  const pct = raw.map(row => { const t = sum(row); return row.map(v => t > 0 ? Math.round(v / t * 100) : 0); });
  const datasets = names.map((n, i) => ({ label: n, data: pct.map(r => r[i]), backgroundColor: colors[i], borderRadius: 0 }));
  return { type: 'bar', data: { labels, datasets }, options: {
    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { callbacks: {
      label: c => c.parsed.x > 0 ? c.dataset.label + ': ' + raw[c.dataIndex][c.datasetIndex] + ' (' + c.parsed.x + '%)' : null,
      footer: items => 'Total accepted: ' + sum(raw[items[0].dataIndex]) } } },
    scales: {
      y: { stacked: true, grid: { display: false }, ticks: { font: { size: 10.5 }, color: '#8a94a6', autoSkip: false } },
      x: { stacked: true, min: 0, max: 100, grid: { color: 'rgba(128,128,128,0.08)' }, ticks: { font: { size: 11 }, color: '#8a94a6', callback: v => v + '%', stepSize: 25 } }
    } } };
}

/* ── Programme demographics: totals per quarter + per programme ── */
const DEMO = {
  fac:  { names:['Science','Health','Humanities','Social Sciences','Theology','Law','Unknown','Not from UCPH'], colors:['#2d7a3a','#425570','#197f8e','#d4843e','#c73028','#ffbd38','#e1dfdf','#666666'], key:'fac', title:'Faculty distribution' },
  acad: { names:['Students','PhD / Researcher','Other','Unknown'], colors:['#0a5963','#3d8a94','#7abcc4','#e1dfdf'], key:'acad', title:'Academic level distribution' },
  gen:  { names:['Female','Male','Other','Unknown'], colors:['#0a5963','#3d8a94','#7abcc4','#e1dfdf'], key:'gen', title:'Gender distribution' }
};
function demoBlock(d, idPrefix, insKey, extraNote) {
  const totals = ['Q1', 'Q2', 'Q3'].map(q => {
    const rows = PROG_DEMO.filter(r => r.q === q);
    return d.names.map((_, i) => rows.reduce((s, r) => s + num0(r[d.key][i]), 0));
  });
  const nQ = totals.map(sum);
  const idT = idPrefix + '_total', idP = idPrefix + '_prog';
  jobs.push([idT, pctBarCfg(['Q1 2026 (n=' + nQ[0] + ')', 'Q2 2026 (n=' + nQ[1] + ')', 'Q3 2026 (' + (nQ[2] ? 'n=' + nQ[2] : 'no data yet') + ')'], totals, d.names, d.colors)]);
  const labels = PROG_DEMO.map(r => `${r.p} — ${r.q}`);
  jobs.push([idP, pctBarCfg(labels, PROG_DEMO.map(r => r[d.key]), d.names, d.colors)]);
  const h = Math.max(200, 50 + labels.length * 34);
  return `<div class="section-eyebrow" style="margin-top:0">${d.title} — total (all programmes) · by quarter · 100% stacked</div>`
    + legend(d.names.map((n, i) => [n, d.colors[i]]), true)
    + `<div style="position:relative;width:100%;height:150px;margin-bottom:20px"><canvas id="${idT}"></canvas></div>`
    + `<div class="section-eyebrow" style="margin-top:0">${d.title} per programme — 100% stacked</div>`
    + legend(d.names.map((n, i) => [n, d.colors[i]]), true)
    + `<div style="position:relative;width:100%;height:${h}px;margin-bottom:6px"><canvas id="${idP}"></canvas></div>`
    + note('Only programme-quarter combinations with data are shown for Q3. ' + (extraNote || ''))
    + ins(insKey);
}

/* ── Department grids ── */
const DEPT_COL = { 'Health': 'var(--sund)', 'Science': 'var(--science)', 'SSH / Law / Theo': 'var(--ssh)' };
function deptGrid(prefix, group) {
  let h = '<div class="three-col">';
  Object.keys(group).forEach((k, i) => {
    const d = group[k], id = `${prefix}_${i}`;
    h += `<div class="card"><div class="card-title" style="color:${DEPT_COL[k]}">${k}</div>`;
    if (!d.labels.length) h += '<p style="font-size:11px;color:var(--soft);margin-top:8px;font-style:italic">No departments recorded.</p>';
    else { h += box(id, 190); jobs.push([id, facCfgQ(d.labels, d.q1, d.q2, d.q3, true)]); }
    h += '</div>';
  });
  return h + '</div>' + LEG_Q3;
}
function combinedCfg(labels, a1, a2, a3, f1, f2, f3, rotate) {
  const L = [], q1a = [], q2a = [], q3a = [], q1f = [], q2f = [], q3f = [];
  labels.forEach((n, i) => {
    L.push(n + ' — Apps'); L.push(n + ' — Funded');
    q1a.push(a1[i], 0); q2a.push(a2[i], 0); q3a.push(num0((a3 || [])[i]), 0);
    q1f.push(0, f1[i]); q2f.push(0, f2[i]); q3f.push(0, num0((f3 || [])[i]));
  });
  return { type: 'bar', data: { labels: L, datasets: [
    ds('Q1 2026 (Applications)', q1a, 'rgba(45,122,58,0.4)', 's'), ds('Q2 2026 (Applications)', q2a, 'rgba(212,132,62,0.4)', 's'), ds('Q3 2026 (Applications)', q3a, 'rgba(91,33,182,0.4)', 's'),
    ds('Q1 2026 (Funded)', q1f, C.q1, 's'), ds('Q2 2026 (Funded)', q2f, C.q2, 's'), ds('Q3 2026 (Funded)', q3f, C.q3, 's') ] }, options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.parsed.y > 0 ? c.dataset.label + ': ' + c.parsed.y : null } } },
    scales: {
      x: { stacked: true, grid: { display: false }, ticks: { color: TC, font: { size: rotate ? 8 : 9 }, maxRotation: rotate ? 65 : 55, minRotation: rotate ? 65 : 55 }, border: { display: false } },
      y: { stacked: true, min: 0, grid: { color: GC }, ticks: { color: TC, font: { size: 10 }, precision: 0 }, border: { display: false } }
    } } };
}
const LEG_POC = legend([['Applications (lighter shade)', 'rgba(120,120,120,0.35)'], ['Funded (full shade)', '#777']]);

/* ── Lists ── */
function eventRows() {
  if (!EVENTS_Q3.length) return '<tr><td colspan="4" class="soft" style="font-style:italic">No Q3 events entered yet — add them to EVENTS_Q3.</td></tr>';
  return EVENTS_Q3.slice().sort((a, b) => b.signups - a.signups).map(e => `<tr><td>${e.date}</td><td><span class="evt-name">${e.name}</span></td><td>${e.mgr || ''}</td><td style="text-align:right">${e.basis === 'none' ? '–' : fmt(e.signups)}</td></tr>`).join('');

}

/* ── Programme table ── */
function progTable() {
  const GREY = 'color:var(--soft);font-style:italic';
  const NA = `<span style="${GREY}">n/a</span>`, PTBA = `<span style="${GREY}">TBA</span>`;
  /* one cell value: 0 / no intake -> "–"; "—" (not applicable) -> n/a; null (not reported) -> TBA */
  const pv = v => v === 0 || v === undefined ? '<span style="color:var(--soft)">–</span>'
    : v === null ? PTBA : (typeof v === 'string' && v.startsWith('—') ? NA : fmt(v));
  const qcell = (q, key, qi) => {
    if (q === null) return '<td class="n" style="text-align:right">' + PTBA + '</td>';
    if (q === undefined) return '<td style="color:var(--soft)">–</td>';
    return `<td class="v">${pv(q[key])}</td>`;
  };
  let h = '<div style="overflow-x:auto"><table class="prog-table"><thead><tr><th style="width:24%">Programme</th>'
    + '<th>Applicants<br>2025</th><th>Accepted indiv.<br>2025</th>'
    + '<th>Applicants<br>Q1 2026</th><th>Accepted indiv.<br>Q1 2026</th><th>Accepted projects<br>Q1 2026</th>'
    + '<th>Applicants<br>Q2 2026</th><th>Accepted indiv.<br>Q2 2026</th><th>Accepted projects<br>Q2 2026</th>'
    + '<th style="background:var(--bg)">Applicants<br>Q3 2026</th><th style="background:var(--bg)">Accepted indiv.<br>Q3 2026</th><th style="background:var(--bg)">Accepted projects<br>Q3 2026</th></tr></thead><tbody>';
  PROG.forEach(p => {
    h += `<tr><td>${p.name}</td>`
      + [p.y25.app, p.y25.acc].map(v => `<td>${pv(v)}</td>`).join('')
      + ['q1', 'q2', 'q3'].map(q => ['app', 'acc', 'proj'].map(k => {
        const x = p[q];
        if (x === null) return '<td style="background:#fafbfc">' + PTBA + '</td>';
        if (x === undefined) return '<td style="color:var(--soft)">–</td>';
        const v = x[k], plain = v === 0 || v === null || (typeof v === 'string' && v.startsWith('—'));
        return `<td style="${q === 'q3' ? 'background:#fafbfc;' : ''}${plain ? '' : 'font-weight:600;color:var(--ink)'}">${pv(v)}</td>`;
      }).join('')).join('') + '</tr>';
  });
  const tot = (get) => sum(PROG.map(get));
  const totCell = (q, k) => {
    const rows = PROG.filter(p => p[q] !== null && p[q] !== undefined);
    if (q === 'q3' && rows.length === 0) return `<td>${TBA}</td>`;
    return `<td>${fmt(sum(rows.map(p => p[q][k])))}</td>`;
  };
  h += '</tbody><tfoot><tr><td>Total</td>'
    + `<td>${fmt(tot(p => p.y25.app))}</td><td>${fmt(tot(p => p.y25.acc))}</td>`
    + ['q1', 'q2', 'q3'].map(q => ['app', 'acc', 'proj'].map(k => totCell(q, k)).join('')).join('')
    + '</tr></tfoot></table></div>';
  return h;
}

/* ── Platform trend (users / projects) ── */
function trendCfg(y25, q1, q2, q3) {
  const growth = [null, q1 - y25, null, isNum(q3) ? q3 - q2 : null, null];
  const total = [y25, q1, q2, isNum(q3) ? q3 : null, null];
  return { type: 'bar', data: { labels: ['2025', "Q1 '26", "Q2 '26", "Q3 '26", "Q4 '26"], datasets: [
    { type: 'bar', label: 'Net growth (quarter)', data: growth,
      backgroundColor: ['#c8d0d8', C.q1, 'rgba(138,148,166,0.14)', C.q3, 'rgba(138,148,166,0.14)'], borderWidth: 0, yAxisID: 'y1', order: 2 },
    { type: 'line', label: 'Active total', data: total, borderColor: '#122947', backgroundColor: '#122947', spanGaps: true,
      segment: { borderDash: ctx => (ctx.p1DataIndex === 2 || ctx.p1DataIndex >= 4 ? [4, 3] : undefined) },
      pointRadius: 4, pointBackgroundColor: ['#8a94a6', '#122947', C.q2, C.q3, '#ccd3dd'], tension: 0.15, yAxisID: 'y', order: 1 } ] }, options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
    scales: {
      x: { grid: { color: GC }, ticks: { color: TC, font: { size: 10 } }, border: { display: false } },
      y: { position: 'left', grid: { color: GC }, ticks: { color: TC, font: { size: 9 } }, title: { display: true, text: 'Active total', color: TC, font: { size: 8 } }, border: { display: false } },
      y1: { position: 'right', grid: { display: false }, ticks: { color: TC, font: { size: 9 } }, title: { display: true, text: 'Net growth', color: TC, font: { size: 8 } }, border: { display: false } }
    } } };
}
